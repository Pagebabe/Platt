<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Anbieter-Login – LIVARA</title><link rel="stylesheet" href="assets/styles.css"></head><body><nav class="nav"><div class="shell nav-inner"><a class="brand" href="index.html">LIV<span>ARA</span></a><div class="nav-links"><a class="keep" href="index.html">Öffentliche Seite</a></div></div></nav><main class="shell auth-page"><section class="panel auth-card"><div class="eyebrow">Geschützter Anbieterbereich</div><h1 id="authTitle">Anmelden</h1><p id="authIntro" class="muted">Melde dich mit deinem Anbieter-Konto an.</p><form id="authForm"><div id="displayNameRow" class="hidden"><label for="displayName">Anzeigename</label><input id="displayName" class="field" maxlength="80" autocomplete="name"></div><div id="phoneRow" class="hidden"><label for="phone">Telefon</label><input id="phone" class="field" type="tel" maxlength="40" autocomplete="tel" placeholder="z. B. +49 …"></div><label for="email">E-Mail</label><input id="email" class="field" type="email" required autocomplete="email"><label for="password">Passwort</label><input id="password" class="field" type="password" minlength="8" required autocomplete="current-password"><div id="registerConsents" class="hidden"><label class="check"><input id="adultAccept" type="checkbox"> Ich bestätige, dass ich mindestens 18 Jahre alt bin.</label><label class="check"><input id="privacyAccept" type="checkbox"> Ich habe die <a href="datenschutz.html">Datenschutzhinweise</a> gelesen und akzeptiere die für die Registrierung erforderliche Verarbeitung.</label><label class="check"><input id="rulesAccept" type="checkbox"> Ich akzeptiere die <a href="anbieterregeln.html">Anbieterregeln</a> und die <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a>.</label></div><button id="authSubmit" class="btn btn-primary full" type="submit">Anmelden</button></form><div id="authMessage" class="notice hidden" role="status"></div><button id="authMode" class="btn btn-ghost full" type="button">Noch kein Konto? Registrieren</button><a id="forgotLink" class="btn btn-ghost full" href="reset.html">Passwort vergessen?</a></section></main><script src="assets/supabase.js"></script><script src="assets/auth.js"></script><script src="assets/login.js"></script></body></html>
