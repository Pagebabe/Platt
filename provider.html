<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Profil bearbeiten – LIVARA</title><link rel="stylesheet" href="assets/styles.css"></head><body><nav class="nav"><div class="shell nav-inner"><a class="brand" href="index.html">LIV<span>ARA</span></a><div class="nav-links"><a class="keep" href="dashboard.html">← Dashboard</a><button id="logoutBtn" class="btn btn-secondary keep">Abmelden</button></div></div></nav><main class="shell narrow"><section class="panel"><div class="section-head"><div><small>Anbieterprofil</small><h1 id="formTitle">Profil erstellen</h1></div><span id="listingStatus" class="status">Entwurf</span></div><p class="muted">Neue oder geänderte Profile werden nicht automatisch verifiziert. Veröffentlichungs- und Verifizierungsstatus werden durch die Moderation geschützt.</p><form id="listingForm" class="form-grid"><label>Name<input id="name" class="field" maxlength="80" required></label><label>Kategorie<select id="category" class="field" required><option>Escort</option><option>Massage</option><option>Studio</option></select></label><label>Stadt<input id="city" class="field" maxlength="80" required></label><label>Stadtteil<input id="district" class="field" maxlength="80"></label><label>Preis ab €<input id="price" class="field" type="number" min="0" max="99999"></label><label class="check field-like"><input id="available" type="checkbox"> Heute verfügbar</label><label class="full-span">Beschreibung<textarea id="description" class="field" rows="7" maxlength="2000"></textarea></label><button class="btn btn-primary full-span" type="submit">Speichern</button></form><div id="formMessage" class="notice hidden" role="status"></div></section></main><script src="assets/supabase.js"></script><script src="assets/auth.js"></script><script src="assets/provider.js"></script></body></html>
