name: Live Health

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check critical pages
        run: |
          set -euo pipefail
          for u in \
            https://platt-beta.netlify.app/ \
            https://platt-beta.netlify.app/profile.html \
            https://platt-beta.netlify.app/login.html \
            https://platt-beta.netlify.app/meldestelle.html; do
            curl --fail --silent --show-error --location --max-time 20 "$u" >/dev/null
          done
      - name: Check security headers
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --head --max-time 20 https://platt-beta.netlify.app/)"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-content-type-options:'
